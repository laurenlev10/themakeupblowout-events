<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Makeup Blowout — Work Availability Form</title>
<style>
  :root{ --pink:#ec4899; --purple:#7c3aed; --ink:#1f2937; --muted:#6b7280; --bg:#f6f7fb; }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:"Segoe UI",Arial,sans-serif}
  .hdr{background:linear-gradient(135deg,#ec4899 0%,#7c3aed 100%);color:#fff;padding:20px 18px;text-align:center}
  .hdr h1{margin:0;font-size:21px;font-weight:900}
  .hdr p{margin:6px 0 0;font-size:13.5px;opacity:.93}
  .wrap{max-width:560px;margin:0 auto;padding:16px}
  .card{background:#fff;border-radius:16px;padding:16px;box-shadow:0 1px 6px rgba(0,0,0,.07);margin-bottom:14px}
  label{display:block;font-size:13px;font-weight:800;color:#6b7280;margin:0 0 5px}
  select,input,textarea{width:100%;border:1px solid #e5e7eb;border-radius:10px;padding:10px;font-size:15px;font-family:inherit;background:#fafafa}
  .ev{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid #f3f4f6;flex-wrap:wrap}
  .ev:last-child{border-bottom:0}
  .ev .when{font-weight:900;font-size:13px;color:var(--purple);min-width:88px}
  .ev .city{font-weight:800;font-size:14.5px;flex:1;min-width:120px}
  .opts{display:flex;gap:6px}
  .opt{border:1.5px solid #e5e7eb;background:#fafafa;border-radius:999px;padding:6px 13px;font-size:13px;font-weight:800;cursor:pointer;user-select:none}
  .opt.yes.on{background:#dcfce7;border-color:#16a34a;color:#166534}
  .opt.no.on{background:#fee2e2;border-color:#dc2626;color:#991b1b}
  /* 27.10.2026 — an event left without ✅/❌ when Send is pressed */
  .ev.missing{background:#fef2f2;border-radius:10px;box-shadow:inset 3px 0 0 #dc2626;padding-left:8px}
  .ev.missing .city::after{content:" — please choose ✅ or ❌";color:#dc2626;font-size:12px;font-weight:800}
  .btn{width:100%;border:0;border-radius:13px;padding:14px;font-size:17px;font-weight:900;cursor:pointer;background:var(--purple);color:#fff;margin-top:6px}
  .btn:disabled{opacity:.6}
  .note{font-size:12px;color:#9ca3af;margin-top:8px;text-align:center}
  .ev .yr{color:var(--muted);font-weight:700;font-size:11px}
  .ev .tent{font-size:11px;font-weight:700;color:#92400e;background:#fef3c7;border-radius:999px;padding:1px 7px;margin-left:4px}
  .okbox{display:none;background:#dcfce7;border:1.5px solid #16a34a;color:#166534;border-radius:14px;padding:16px;text-align:center;font-weight:800;margin-bottom:14px}
</style>
</head>
<body>
<div class="hdr">
  <h1>💄 The Makeup Blowout Sale</h1>
  <p>Tell us which upcoming events you're available &amp; want to work 💪</p>
</div>
<div class="wrap">
  <div class="okbox" id="okbox">✅ Thank you! Your availability was sent to Lauren.</div>
  <div class="card">
    <label>Who are you? *</label>
    <select id="f-who"><option value="">— choose your name —</option></select>
    <div style="height:10px"></div>
    <label>Phone (optional)</label>
    <input id="f-phone" type="tel" placeholder="+1 ...">
  </div>
  <div class="card">
    <label style="font-size:14.5px;color:#1f2937">📅 Upcoming events — tap ✅ if you're available &amp; interested, ❌ if not. <b style="color:#dc2626">Every event needs an answer.</b></label>
    <div id="ev-list">Loading events…</div>
  </div>
  <div class="card">
    <label>Notes (optional — preferences, constraints, anything)</label>
    <textarea id="f-notes" rows="3" placeholder="e.g. I prefer west coast events / not available in August..."></textarea>
  </div>
  <button class="btn" id="btn-send" onclick="submitForm()">📨 Send my availability</button>
  <div class="note">Your answers go straight to Lauren's team dashboard.<br>
  Trouble sending? <a href="#" onclick="copyText();return false;">Copy as text</a> and paste it to Lauren on WhatsApp.</div>
</div>

<script>
"use strict";
var ROSTER=null, EVENTS={}, ANSWERS={}, ENDPOINT="https://danielle.laurenlev10.workers.dev/";
var RAW="https://dashboard.themakeupblowout.com/";  // legacy base, repointed off raw.githubusercontent (private-safe); live fetches below already use the dashboard domain
var LAUREN_WA="14243547625";
function esc(s){ return String(s==null?"":s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;"); }
function fmtDate(iso){ if(!iso) return ""; var p=iso.split("-"); return p[1]+"/"+p[2]; }
async function init(){
  try{ var rc=await fetch("https://dashboard.themakeupblowout.com/manager-report/config.json?_="+Date.now(),{cache:"no-store"}); if(rc.ok){ var ep=((await rc.json()).save_endpoint||"").trim(); if(ep) ENDPOINT=ep; } }catch(e){}
  // 🛑 2026-08-20 — same trap that emptied the crew count sheet. The hub's pages.yml
  // stopped republishing docs/state/** on 2026-08-18, so the PUBLISHED copy of this
  // roster only changes when some unrelated docs/ commit happens to rebuild the site.
  // The dashboards were rerouted through the Worker in that change; this page is another
  // repo on another domain and nothing shimmed it. It has not bitten yet only because
  // the roster last changed in June — which is luck, not a design. The Worker reads it
  // from git; the published copy stays as a fail-soft fallback.
  try{
    var rw=await fetch(ENDPOINT,{method:"POST",headers:{"Content-Type":"application/json"},
      body:JSON.stringify({kind:"get_team_roster"})});
    if(!rw.ok) throw new Error("worker "+rw.status);
    var dw=await rw.json();
    if(!dw||dw.ok!==true||!dw.roster) throw new Error("worker refused");
    ROSTER=dw.roster;
  }catch(e){
    try{
      var r=await fetch("https://dashboard.themakeupblowout.com/state/team_roster_public.json?_="+Date.now(),{cache:"no-store"});
      ROSTER=await r.json();
    }catch(e2){ document.getElementById("ev-list").textContent="⚠️ Could not load events — please try again later."; return; }
  }
  if(!ROSTER||!ROSTER.members){ document.getElementById("ev-list").textContent="⚠️ Could not load events — please try again later."; return; }
  var today=new Date().toISOString().slice(0,10);
  var sel=document.getElementById("f-who");
  // 26.10.2026 — the same test /team/ uses (offStaff): a worker retired with ⏸ on /team/
  // carries inactive_from, and from that date they are not offered here either.
  Object.keys(ROSTER.members).filter(function(s){ var m=ROSTER.members[s];
      return m.active!==false && !(m.inactive_from && m.inactive_from<=today); })
    .sort(function(a,b){ return (ROSTER.members[a].name||"").localeCompare(ROSTER.members[b].name||""); })
    .forEach(function(s){
      var o=document.createElement("option"); o.value=s; o.textContent=ROSTER.members[s].full_name||ROSTER.members[s].name; sel.appendChild(o);
    });
  var other=document.createElement("option"); other.value="__other__"; other.textContent="Someone else (type name in notes)"; sel.appendChild(other);
  // 26.10.2026 — Lauren: the form asks about the events AFTER Tucson (not including it)
  // through the end of 2027. The window is data (team_roster.json → availability_window, published
  // in the projection); the events are the ONE event list, events_index.json, read through the
  // Worker. It used to list roster.assignments — which only holds events someone already staffed,
  // so a weekend nobody had staffed yet could never be asked about.
  // A failed read shows a failure — never an empty or a guessed list (IRON RULE #18).
  var box=document.getElementById("ev-list"), win=ROSTER.availability_window;
  if(!win||!win.after_evkey||!win.through){ box.textContent="⚠️ The event list is not set up — please tell Lauren."; return; }
  var idx=null;
  try{
    var ri=await fetch(ENDPOINT,{method:"POST",headers:{"Content-Type":"application/json"},
      body:JSON.stringify({kind:"get_events_index"})});
    if(!ri.ok) throw new Error("worker "+ri.status);
    var di=await ri.json();
    if(!di||di.ok!==true||!di.events_index||!(di.events_index.events||[]).length) throw new Error("worker refused");
    idx=di.events_index.events;
  }catch(e){ box.textContent="⚠️ Could not load events — please try again later."; return; }
  var after=idx.filter(function(e){ return e.evkey===win.after_evkey; })[0];
  if(!after){ box.textContent="⚠️ The event list is not set up — please tell Lauren."; return; }
  var from=after.end_date||after.start_date;
  var evs=idx.filter(function(e){ return e.start_date>from && e.start_date<=win.through && e.end_date>=today; });
  evs.sort(function(a,b){ return a.start_date<b.start_date?-1:1; });
  evs.forEach(function(e){ EVENTS[e.evkey]=e; });
  box.innerHTML = evs.map(function(a){
    var ev=a.evkey, tent=(a.status!=="confirmed");
    return '<div class="ev" id="ev-'+ev+'"><span class="when">'+fmtDate(a.start_date)+'–'+fmtDate(a.end_date)+(a.start_date.slice(0,4)!==today.slice(0,4)?' <span class="yr">'+a.start_date.slice(0,4)+'</span>':'')+'</span>'+
      '<span class="city">'+esc(a.city)+', '+esc(a.state||"")+(tent?' <span class="tent" title="Dates not final yet">tentative</span>':'')+'</span>'+
      '<span class="opts">'+
      '<span class="opt yes" id="y-'+ev+'" onclick="pick(\''+ev+'\',\'yes\')">✅ Available</span>'+
      '<span class="opt no" id="n-'+ev+'" onclick="pick(\''+ev+'\',\'no\')">❌ No</span>'+
      '</span></div>';
  }).join("") || "No upcoming events right now.";
}
function pick(ev, ans){
  if (ANSWERS[ev]===ans){ delete ANSWERS[ev]; }
  else ANSWERS[ev]=ans;
  document.getElementById("y-"+ev).classList.toggle("on", ANSWERS[ev]==="yes");
  document.getElementById("n-"+ev).classList.toggle("on", ANSWERS[ev]==="no");
  var row=document.getElementById("ev-"+ev); if(row && ANSWERS[ev]) row.classList.remove("missing");
}
function buildText(p){
  var lines=["Availability form — "+p.name, ""];
  Object.keys(p.events).forEach(function(ev){
    var a=EVENTS[ev]||{};
    lines.push((p.events[ev]==="yes"?"✅":"❌")+" "+(a.city||ev)+", "+(a.state||"")+" ("+fmtDate(a.start_date)+")");
  });
  if(p.phone) lines.push("", "Phone: "+p.phone);
  if(p.notes) lines.push("", "Notes: "+p.notes);
  return lines.join("\n");
}
function collectP(){
  var who=document.getElementById("f-who").value;
  if(!who){ alert("Please choose your name 🙂"); return null; }
  /* 27.10.2026 — Lauren: a worker MUST answer every event. Roey sent ✅ for two events and
     skipped Santa Ana; on /team/ that reads "has not answered" and she cannot tell whether he
     left it open on purpose. Nothing is sent until every listed event has ✅ or ❌. */
  var missing=Object.keys(EVENTS).filter(function(ev){ return ANSWERS[ev]!=="yes" && ANSWERS[ev]!=="no"; });
  if(!Object.keys(EVENTS).length){ alert("There are no events to answer right now 🙂"); return null; }
  if(missing.length){
    missing.forEach(function(ev){ var row=document.getElementById("ev-"+ev); if(row) row.classList.add("missing"); });
    var first=document.getElementById("ev-"+missing[0]); if(first && first.scrollIntoView) first.scrollIntoView({behavior:"smooth",block:"center"});
    alert("Please choose ✅ Available or ❌ No for every event ("+missing.length+" left: "+missing.map(function(ev){ return (EVENTS[ev]||{}).city||ev; }).join(", ")+")");
    return null;
  }
  var m=(who!=="__other__" && ROSTER.members[who])||null;
  return {
    kind:"team_availability", evkey:"team-availability", mode:"final",
    member_slug:(who==="__other__"?"":who),
    name:(m?(m.full_name||m.name):"(other — see notes)"),
    manager_name:(m?(m.full_name||m.name):"(other)"),
    phone:document.getElementById("f-phone").value.trim(),
    notes:document.getElementById("f-notes").value.trim(),
    events:Object.assign({}, ANSWERS),
    submitted_at:new Date().toISOString(),
    source:"availability-form-public"
  };
}
function copyText(){
  var p=collectP(); if(!p) return;
  var t=buildText(p);
  if(navigator.clipboard&&navigator.clipboard.writeText){ navigator.clipboard.writeText(t).then(function(){ alert("Copied! Paste it to Lauren on WhatsApp 🙂"); }); }
  else prompt("Copy this text:", t);
}
async function submitForm(){
  var p=collectP(); if(!p) return;
  var btn=document.getElementById("btn-send");
  btn.disabled=true; btn.textContent="⏳ Sending...";
  if(ENDPOINT){
    try{
      var r=await fetch(ENDPOINT,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(p)});
      if(r.ok){
        document.getElementById("okbox").style.display="block";
        btn.textContent="✓ Sent!"; window.scrollTo(0,0);
        return;
      }
      throw new Error("HTTP "+r.status);
    }catch(e){ console.warn("endpoint failed:", e); }
  }
  // fallback — WhatsApp to Lauren
  window.open("https://wa.me/"+LAUREN_WA+"?text="+encodeURIComponent(buildText(p)),"_blank");
  btn.disabled=false; btn.textContent="📨 Send my availability";
}
init();
</script>
</body>
</html>
