name: Build landing pages

# Auto-rebuilds docs/events/<slug>/{index.html,share.html} whenever upcoming-events.json
# (or any docs/_template/* file) changes. This means: as soon as @setup or @campaigns
# pushes new event data into upcoming-events.json, the landing pages refresh automatically
# — Lauren no longer needs to manually run @landing for every new event.
#
# Also runs on a daily cron as a safety net (catches manual edits via the GitHub web UI).

on:
  push:
    branches: [main]
    paths:
      - 'docs/upcoming-events.json'
      - 'docs/_template/**'
      - 'scripts/build.py'
      - '.github/workflows/build-landing-pages.yml'
  schedule:
    - cron: '15 3 * * *'   # 03:15 UTC daily — refresh pages even if no recent push
  workflow_dispatch: {}

# Avoid loops: this workflow MAY commit, but the commit message starts with
# "[build]" and the trigger excludes its own paths effectively. Still, we add
# a guard below.

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    if: ${{ !contains(github.event.head_commit.message, '[skip-build]') }}
    steps:
      - uses: actions/checkout@v4

      # 🛑 IRON RULE #23 / #27 — build.py computes every JSON-LD startDate/endDate
      # through lauren-agent-infra/lib/venue_tz.py (the ONE state→timezone table).
      # A checkout, not a copy: a second copy of the table here would rot against
      # the original, exactly like clone_traffic_pair.py's hard-coded -07:00 did.
      # build.py refuses to run when infra/lib/venue_tz.py is absent.
      - name: Checkout infra (lib/venue_tz.py)
        uses: actions/checkout@v4
        with:
          repository: laurenlev10/lauren-agent-infra
          token: ${{ secrets.INFRA_PAT }}
          path: infra
          sparse-checkout: lib
          sparse-checkout-cone-mode: false

      - name: Run build.py
        env:
          GA4_MEASUREMENT_ID: ${{ secrets.GA4_MEASUREMENT_ID }}
          META_PIXEL_ID:      ${{ secrets.META_PIXEL_ID }}
          TIKTOK_PIXEL_ID:    ${{ secrets.TIKTOK_PIXEL_ID }}
        run: |
          python3 --version
          python3 scripts/build.py "$(pwd)"

      - name: Commit + push if anything changed
        run: |
          git config user.email "lauren@noreply.github.com"
          git config user.name "Lauren (via build-landing-pages)"
          # docs/events/ carries the per-city pages AND docs/events/index.html;
          # sitemap.xml / robots.txt are rebuilt from the same facts every run.
          git add docs/events/ docs/sitemap.xml docs/robots.txt
          if ! git diff --cached --quiet; then
            git commit -m "build: regenerate landing pages [skip-build]"
            git pull --rebase origin main || true
            git push origin main
            echo "✓ pushed regenerated pages"
          else
            echo "no changes to commit"
          fi
